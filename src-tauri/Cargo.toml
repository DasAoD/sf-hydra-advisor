[package]
name = "sf-hydra-advisor-gui"
version = "0.3.0"
description = "SF Hydra Pet Advisor"
authors = ["DasAoD"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
winresource = "0.1"
tauri-build = { version = "2.6.2", features = [] }
cc = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["rustls-tls", "protocol-asset"] }
tauri-plugin-log = "2"
sf-api = { path = "../../sf-api", features = ["serde", "sso"] }
tokio = { version = "1", features = ["full"] }
unity-asset-decode = { version = "0.2.0", features = ["sprite", "texture-advanced"] }
unity-asset-core = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = "0.25"
texture2ddecoder = "0.1"
tauri-plugin-updater = "2"
